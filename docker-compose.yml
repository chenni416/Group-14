# 本機開發用的資料庫：`docker compose up -d`
# 後端與前端直接在本機執行（見 README），改程式不需要重新 build 容器
services:
  db:
    # 內建 pgvector，之後要加入向量檢索不需要換映像檔
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taskline
      POSTGRES_PASSWORD: taskline
      POSTGRES_DB: taskline
    # 主機端預設用 5433，避免和其他專案的 Postgres（常用 5432）衝突；可用 TASKLINE_DB_PORT 調整
    ports:
      - "${TASKLINE_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskline"]
      interval: 5s
      retries: 10

volumes:
  db-data:
