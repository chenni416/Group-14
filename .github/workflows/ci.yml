# 每次 push 與 PR 檢查前後端；只做檢查，不部署
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 需要資料庫的測試（tests/db）使用這個 Postgres，不會連到共用的 Supabase
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taskline
          POSTGRES_PASSWORD: taskline
          POSTGRES_DB: taskline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://taskline:taskline@localhost:5432/taskline_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
